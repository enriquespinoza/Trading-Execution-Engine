[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-execution-engine"
version = "0.8.0"
description = "Deterministic portfolio execution, risk gating, and paper-trading infrastructure."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
push = ["python-dotenv>=1.0,<2"]
sms = [
    "twilio>=9.11,<10",
    "python-dotenv>=1.0,<2",
    "flask>=3.0,<4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
